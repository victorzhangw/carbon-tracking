<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>情緒識別系統 - AI 語音分析</title>

    <!-- Material Icons -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />

    <!-- 統一返回按鈕樣式 -->
    <link rel="stylesheet" href="/static/css/back_button.css" />

    <!-- 評分系統樣式 -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/score_report.css') }}"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Microsoft JhengHei", Arial, sans-serif;
        background: #e8e8e8;
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
        height: calc(100vh - 40px);
      }

      /* Header */
      .header {
        background: white;
        border-radius: 8px;
        padding: 20px 24px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        flex-shrink: 0;
      }

      .header-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .header h1 {
        font-size: 22px;
        color: #333;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .back-btn {
        padding: 8px 16px;
        background: #f8f9fa;
        border: 1px solid #e9ecef;
        border-radius: 6px;
        color: #666;
        text-decoration: none;
        font-size: 14px;
        transition: all 0.2s;
      }

      .back-btn:hover {
        background: #e9ecef;
        color: #333;
      }

      /* Main Content */
      .main-content {
        display: flex;
        gap: 20px;
        flex: 1;
        min-height: 0;
      }

      /* Left Panel - Control */
      .control-panel {
        width: 320px;
        background: white;
        border-radius: 8px;
        padding: 24px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        display: flex;
        flex-direction: column;
        gap: 20px;
        flex-shrink: 0;
      }

      .panel-title {
        font-size: 16px;
        font-weight: 600;
        color: #333;
        margin-bottom: 8px;
      }

      .button-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .btn {
        padding: 14px 20px;
        border: none;
        border-radius: 6px;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .btn-primary {
        background: #4361ee;
        color: white;
      }

      .btn-primary:hover:not(:disabled) {
        background: #3a0ca3;
        transform: translateY(-1px);
      }

      .btn-danger {
        background: #e71d36;
        color: white;
      }

      .btn-danger:hover:not(:disabled) {
        background: #c41230;
        transform: translateY(-1px);
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none !important;
      }

      .btn-end-session {
        background: #7209b7;
        color: white;
        width: 100%;
        margin-top: 16px;
      }

      .btn-end-session:hover:not(:disabled) {
        background: #560bad;
        transform: translateY(-1px);
      }

      /* Waveform */
      .waveform-container {
        width: 100%;
        height: 120px;
        background: #f8f9fa;
        border-radius: 6px;
        overflow: hidden;
        border: 1px solid #e9ecef;
      }

      canvas {
        width: 100%;
        height: 100%;
      }

      /* Status */
      .status-box {
        padding: 12px;
        background: #f8f9fa;
        border-radius: 6px;
        font-size: 13px;
        color: #666;
        text-align: center;
        border: 1px solid #e9ecef;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      .status-box .material-symbols-outlined {
        font-size: 18px;
        vertical-align: middle;
      }

      .status-box.active {
        background: #e7f1ff;
        color: #0d6efd;
        border-color: #b6d4fe;
      }

      /* Right Panel - Chat */
      .chat-panel {
        flex: 1;
        background: white;
        border-radius: 8px;
        padding: 24px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .chat-title {
        font-size: 16px;
        font-weight: 600;
        color: #333;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid #f1f3f5;
      }

      .chat-messages {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding-right: 8px;
      }

      .chat-messages::-webkit-scrollbar {
        width: 6px;
      }

      .chat-messages::-webkit-scrollbar-track {
        background: #f1f3f5;
        border-radius: 3px;
      }

      .chat-messages::-webkit-scrollbar-thumb {
        background: #cbd5e0;
        border-radius: 3px;
      }

      .chat-messages::-webkit-scrollbar-thumb:hover {
        background: #a0aec0;
      }

      /* Message Bubble */
      .message {
        display: flex;
        gap: 12px;
        animation: slideIn 0.3s ease;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message.user {
        flex-direction: row-reverse;
      }

      .message-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        flex-shrink: 0;
      }

      .message.ai .message-avatar {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }

      .message.user .message-avatar {
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      }

      .message-content {
        max-width: 70%;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .message-bubble {
        padding: 12px 16px;
        border-radius: 12px;
        font-size: 14px;
        line-height: 1.6;
        word-wrap: break-word;
      }

      .message.ai .message-bubble {
        background: #f8f9fa;
        color: #333;
        border-bottom-left-radius: 4px;
      }

      .message.user .message-bubble {
        background: #4361ee;
        color: white;
        border-bottom-right-radius: 4px;
      }

      .message-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: #999;
        padding: 0 4px;
      }

      .message.user .message-meta {
        flex-direction: row-reverse;
      }

      /* Emotion Badge */
      .emotion-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 10px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 500;
      }

      .emotion-badge .material-symbols-outlined {
        font-size: 16px;
        vertical-align: middle;
      }

      .emotion-happy {
        background: #d1e7dd;
        color: #0f5132;
      }

      .emotion-sad {
        background: #cfe2ff;
        color: #084298;
      }

      .emotion-angry {
        background: #f8d7da;
        color: #842029;
      }

      .emotion-neutral {
        background: #e2e3e5;
        color: #41464b;
      }

      .emotion-fear {
        background: #fff3cd;
        color: #664d03;
      }

      .emotion-surprise {
        background: #d3d3f5;
        color: #4a148c;
      }

      /* Loading */
      .loading {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid #f3f3f3;
        border-top: 2px solid #4361ee;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .typing-indicator {
        display: flex;
        gap: 4px;
        padding: 12px 16px;
      }

      .typing-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #cbd5e0;
        animation: typing 1.4s infinite;
      }

      .typing-dot:nth-child(2) {
        animation-delay: 0.2s;
      }

      .typing-dot:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes typing {
        0%,
        60%,
        100% {
          transform: translateY(0);
        }
        30% {
          transform: translateY(-10px);
        }
      }

      /* Responsive */
      @media (max-width: 768px) {
        .main-content {
          flex-direction: column;
        }

        .control-panel {
          width: 100%;
        }

        .message-content {
          max-width: 85%;
        }
      }
    </style>
    <!-- Material Icons -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/material-icons.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <div class="header">
        <div class="header-top">
          <div style="display: flex; align-items: center; gap: 15px">
            <a href="/voice-testing" class="back-btn dark" title="返回語音測試">
              <span class="material-icons">arrow_back</span>
            </a>
            <h1>
              <span
                ><span class="material-symbols-outlined filled"
                  >bar_chart</span
                ></span
              >
              情緒識別系統
            </h1>
          </div>
        </div>
      </div>

      <!-- Main Content -->
      <div class="main-content">
        <!-- Left Panel - Control -->
        <div class="control-panel">
          <div>
            <div class="panel-title">錄音控制</div>
            <div class="button-group">
              <button id="startRecord" class="btn btn-primary">
                <span class="material-symbols-outlined filled">mic</span>
                開始錄音
              </button>
              <button id="stopRecord" class="btn btn-danger" disabled>
                <span class="material-symbols-outlined filled">stop</span>
                停止錄音
              </button>
            </div>
          </div>

          <div>
            <div class="panel-title">語音波形</div>
            <div class="waveform-container">
              <canvas id="waveform"></canvas>
            </div>
          </div>

          <div class="status-box" id="statusBox">等待開始...</div>
        </div>

        <!-- Right Panel - Chat -->
        <div class="chat-panel">
          <div class="chat-title">對話記錄</div>
          <div class="chat-messages" id="chatMessages">
            <!-- Messages will be added here dynamically -->
          </div>
          <button id="endSession" class="btn btn-end-session" disabled>
            <span class="material-symbols-outlined filled">flag</span> 結束對話
          </button>
        </div>
      </div>
    </div>

    <script>
      // DOM Elements
      const startRecordBtn = document.getElementById("startRecord");
      const stopRecordBtn = document.getElementById("stopRecord");
      const waveformCanvas = document.getElementById("waveform");
      const statusBox = document.getElementById("statusBox");
      const chatMessages = document.getElementById("chatMessages");

      // Setup canvas
      waveformCanvas.width = waveformCanvas.parentElement.offsetWidth;
      waveformCanvas.height = waveformCanvas.parentElement.offsetHeight;
      const canvasCtx = waveformCanvas.getContext("2d");

      // Recording variables
      let mediaRecorder;
      let audioChunks = [];
      let analyser;
      let dataArray;
      let animationId;

      // Weather and location data
      let weatherData = null;
      let userLocation = null;

      // 評分系統管理器
      let scoreManager = null;

      // 對話歷史管理
      let conversationHistory = [];
      let conversationRound = 0;

      // Auto-stop detection variables
      const SILENCE_THRESHOLD = 0.01; // 靜音閾值（0-1）
      const SILENCE_DURATION = 2000; // 靜音持續時間（毫秒）
      const MIN_RECORDING_TIME = 500; // 最短錄音時間（避免誤觸）
      const MAX_RECORDING_TIME = 30000; // 最長錄音時間（30秒）

      let silenceStart = null;
      let recordingStartTime = null;
      let maxTimeTimer = null;
      let isAutoStopping = false;

      // Calculate audio volume (RMS)
      function getAudioVolume() {
        analyser.getByteTimeDomainData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) {
          const normalized = (dataArray[i] - 128) / 128;
          sum += normalized * normalized;
        }
        return Math.sqrt(sum / dataArray.length);
      }

      // Check for silence
      function checkSilence() {
        // 確保已經錄音超過最短時間
        if (Date.now() - recordingStartTime < MIN_RECORDING_TIME) {
          return;
        }

        const volume = getAudioVolume();

        if (volume < SILENCE_THRESHOLD) {
          // 開始靜音計時
          if (!silenceStart) {
            silenceStart = Date.now();
            updateStatus("🔇 檢測到靜音...", true);
          }

          // 檢查靜音持續時間
          const silenceDuration = Date.now() - silenceStart;
          if (silenceDuration > SILENCE_DURATION) {
            autoStopRecording("檢測到靜音");
          }
        } else {
          // 有聲音，重置靜音計時
          if (silenceStart) {
            silenceStart = null;
            const elapsed = Math.floor(
              (Date.now() - recordingStartTime) / 1000
            );
            updateStatus(
              `<span class="material-symbols-outlined filled">mic</span> 錄音中... ${elapsed}秒`,
              true
            );
          }
        }
      }

      // Auto stop recording
      function autoStopRecording(reason) {
        if (isAutoStopping) return;
        isAutoStopping = true;

        console.log("自動停止錄音:", reason);
        updateStatus(
          `<span class="material-symbols-outlined filled">stop</span> ${reason}，正在處理...`,
          true
        );

        // 觸發停止錄音
        setTimeout(() => {
          stopRecordBtn.click();
        }, 100);
      }

      // Draw waveform
      function drawWaveform() {
        animationId = requestAnimationFrame(drawWaveform);
        analyser.getByteTimeDomainData(dataArray);

        canvasCtx.fillStyle = "#f8f9fa";
        canvasCtx.fillRect(0, 0, waveformCanvas.width, waveformCanvas.height);
        canvasCtx.lineWidth = 2;
        canvasCtx.strokeStyle = "#4361ee";
        canvasCtx.beginPath();

        const sliceWidth = waveformCanvas.width / dataArray.length;
        let x = 0;

        for (let i = 0; i < dataArray.length; i++) {
          const v = dataArray[i] / 128.0;
          const y = (v * waveformCanvas.height) / 2;

          if (i === 0) {
            canvasCtx.moveTo(x, y);
          } else {
            canvasCtx.lineTo(x, y);
          }

          x += sliceWidth;
        }

        canvasCtx.lineTo(waveformCanvas.width, waveformCanvas.height / 2);
        canvasCtx.stroke();

        // 檢查靜音（僅在錄音時）
        if (
          mediaRecorder &&
          mediaRecorder.state === "recording" &&
          !isAutoStopping
        ) {
          checkSilence();
        }
      }

      // Update status
      function updateStatus(message, active = false) {
        statusBox.innerHTML = message;
        if (active) {
          statusBox.classList.add("active");
        } else {
          statusBox.classList.remove("active");
        }
      }

      // Add AI message with typewriter effect
      function addAIMessage(text, emotion = null, useTypewriter = false) {
        const messageDiv = document.createElement("div");
        messageDiv.className = "message ai";

        const avatar = document.createElement("div");
        avatar.className = "message-avatar";
        avatar.innerHTML =
          '<span class="material-symbols-outlined filled">smart_toy</span>';

        const content = document.createElement("div");
        content.className = "message-content";

        const bubble = document.createElement("div");
        bubble.className = "message-bubble";

        const meta = document.createElement("div");
        meta.className = "message-meta";

        const time = document.createElement("span");
        time.textContent = new Date().toLocaleTimeString("zh-TW", {
          hour: "2-digit",
          minute: "2-digit",
        });
        meta.appendChild(time);

        if (emotion) {
          const badge = document.createElement("span");
          badge.className = `emotion-badge emotion-${emotion.class}`;
          badge.innerHTML = emotion.text;
          meta.appendChild(badge);
        }

        content.appendChild(bubble);
        content.appendChild(meta);
        messageDiv.appendChild(avatar);
        messageDiv.appendChild(content);

        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        // 打字機效果
        if (useTypewriter) {
          let index = 0;
          bubble.textContent = "";

          return new Promise((resolve) => {
            const typeInterval = setInterval(() => {
              if (index < text.length) {
                bubble.textContent += text[index];
                index++;
                chatMessages.scrollTop = chatMessages.scrollHeight;
              } else {
                clearInterval(typeInterval);
                resolve();
              }
            }, 80); // 每個字 80ms（更慢）
          });
        } else {
          bubble.textContent = text;
          return Promise.resolve();
        }
      }

      // Add user message
      function addUserMessage(text) {
        const messageDiv = document.createElement("div");
        messageDiv.className = "message user";

        const avatar = document.createElement("div");
        avatar.className = "message-avatar";
        avatar.innerHTML =
          '<span class="material-symbols-outlined filled">person</span>';

        const content = document.createElement("div");
        content.className = "message-content";

        const bubble = document.createElement("div");
        bubble.className = "message-bubble";
        bubble.textContent = text;

        const meta = document.createElement("div");
        meta.className = "message-meta";

        const time = document.createElement("span");
        time.textContent = new Date().toLocaleTimeString("zh-TW", {
          hour: "2-digit",
          minute: "2-digit",
        });
        meta.appendChild(time);

        content.appendChild(bubble);
        content.appendChild(meta);
        messageDiv.appendChild(avatar);
        messageDiv.appendChild(content);

        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      // Add typing indicator
      function addTypingIndicator() {
        const messageDiv = document.createElement("div");
        messageDiv.className = "message ai";
        messageDiv.id = "typingIndicator";

        const avatar = document.createElement("div");
        avatar.className = "message-avatar";
        avatar.innerHTML =
          '<span class="material-symbols-outlined filled">smart_toy</span>';

        const content = document.createElement("div");
        content.className = "message-content";

        const bubble = document.createElement("div");
        bubble.className = "message-bubble";

        const typing = document.createElement("div");
        typing.className = "typing-indicator";
        typing.innerHTML =
          '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';

        bubble.appendChild(typing);
        content.appendChild(bubble);
        messageDiv.appendChild(avatar);
        messageDiv.appendChild(content);

        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      // Remove typing indicator
      function removeTypingIndicator() {
        const indicator = document.getElementById("typingIndicator");
        if (indicator) {
          indicator.remove();
        }
      }

      // Get emotion info
      function getEmotionInfo(emotion) {
        const emotionMap = {
          happy: {
            class: "happy",
            text: '<span class="material-symbols-outlined filled">sentiment_satisfied</span> 開心',
          },
          sad: {
            class: "sad",
            text: '<span class="material-symbols-outlined filled">sentiment_dissatisfied</span> 悲傷',
          },
          angry: {
            class: "angry",
            text: '<span class="material-symbols-outlined filled">sentiment_very_dissatisfied</span> 憤怒',
          },
          neutral: {
            class: "neutral",
            text: '<span class="material-symbols-outlined filled">sentiment_neutral</span> 中性',
          },
          fear: {
            class: "fear",
            text: '<span class="material-symbols-outlined filled">sentiment_stressed</span> 恐懼',
          },
          surprise: {
            class: "surprise",
            text: '<span class="material-symbols-outlined filled">sentiment_excited</span> 驚訝',
          },
        };

        return (
          emotionMap[emotion] || {
            class: "neutral",
            text: `<span class="material-symbols-outlined filled">sentiment_neutral</span> ${emotion}`,
          }
        );
      }

      // Get user location
      async function getUserLocation() {
        return new Promise((resolve, reject) => {
          if (!navigator.geolocation) {
            reject(new Error("瀏覽器不支援地理定位"));
            return;
          }

          navigator.geolocation.getCurrentPosition(
            (position) => {
              resolve({
                latitude: position.coords.latitude,
                longitude: position.coords.longitude,
              });
            },
            (error) => {
              console.warn("無法取得地理位置:", error);
              resolve({ latitude: 25.033, longitude: 121.5654 });
            }
          );
        });
      }

      // Get weather data
      async function getWeatherData(location) {
        try {
          const response = await fetch("/api/weather/by-location", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(location),
          });

          if (response.ok) {
            const data = await response.json();
            return data;
          }
        } catch (error) {
          console.error("取得天氣資料失敗:", error);
        }
        return null;
      }

      // Get time period greeting
      function getTimePeriodGreeting() {
        const now = new Date();
        const hour = now.getHours();

        if (hour >= 5 && hour < 12) {
          return {
            period: "早上",
            emoji:
              '<span class="material-symbols-outlined filled">wb_twilight</span>',
          };
        } else if (hour >= 12 && hour < 14) {
          return {
            period: "中午",
            emoji:
              '<span class="material-symbols-outlined filled">wb_sunny</span>',
          };
        } else if (hour >= 14 && hour < 18) {
          return {
            period: "下午",
            emoji:
              '<span class="material-symbols-outlined filled">wb_sunny</span>',
          };
        } else if (hour >= 18 && hour < 22) {
          return {
            period: "晚上",
            emoji:
              '<span class="material-symbols-outlined filled">location_city</span>',
          };
        } else {
          return {
            period: "深夜",
            emoji:
              '<span class="material-symbols-outlined filled">nightlight</span>',
          };
        }
      }

      // Get time-based weather advice
      function getTimeBasedAdvice(hour, weather) {
        const { condition, temperature, rain_probability } = weather;

        // 活動建議庫（根據天氣和時段）
        const activities = {

      // Generate weather greeting
      function generateWeatherGreeting(weather) {
        const now = new Date();
        const hour = now.getHours();
        const timeInfo = getTimePeriodGreeting();

        // 格式化時間
        const timeStr = now.toLocaleTimeString("zh-TW", {
          hour: "numeric",
          minute: "2-digit",
          hour12: false,
        });

        if (!weather) {
          return `${timeInfo.emoji} ${timeInfo.period}好呀！現在是${timeStr}，很高興為您服務～有什麼我可以幫忙的嗎？`;
        }

        const { city, condition, temperature, rain_probability } = weather;

        // 口語化的問候開場
        const openings = [
          `嗨！${timeInfo.period}好呀～`,
          `哈囉！${timeInfo.period}安～`,
          `嘿！${timeInfo.period}好呢～`,
          `您好呀！${timeInfo.period}安～`,
        ];
        const opening = openings[Math.floor(Math.random() * openings.length)];

        // 口語化的天氣描述
        let weatherDesc = "";
        if (temperature > 30) {
          weatherDesc = `現在是${timeStr}，${city}的天氣${condition}，溫度有${temperature}度呢，真的蠻熱的！`;
        } else if (temperature < 15) {
          weatherDesc = `現在是${timeStr}，${city}的天氣${condition}，溫度只有${temperature}度，有點冷呢～`;
        } else {
          weatherDesc = `現在是${timeStr}，${city}的天氣${condition}，溫度大約${temperature}度，還算舒適！`;
        }

        // 基本問候
        let greeting = `${opening} ${weatherDesc}`;

        // 根據時段和天氣給建議
        const advice = getTimeBasedAdvice(hour, weather);
        greeting += advice;

        return greeting;
      }

      // Generate TTS for greeting

        try {

            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ text: text }),
          });

          if (response.ok) {
            const result = await response.json();
            return result.audio_url;
          }
        } catch (error) {
          console.error("生成問候語音失敗:", error);
        }
        return null;
      }

      // Start recording
      startRecordBtn.addEventListener("click", async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: true,
          });

          const audioContext = new (window.AudioContext ||
            window.webkitAudioContext)();
          const source = audioContext.createMediaStreamSource(stream);
          analyser = audioContext.createAnalyser();
          analyser.fftSize = 2048;
          dataArray = new Uint8Array(analyser.frequencyBinCount);
          source.connect(analyser);

          drawWaveform();

          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = (event) => {
            audioChunks.push(event.data);
          };

          mediaRecorder.start();

          // 重置自動停止相關變數
          recordingStartTime = Date.now();
          silenceStart = null;
          isAutoStopping = false;

          // 設定最大錄音時長保護
          maxTimeTimer = setTimeout(() => {
            autoStopRecording("已達最大錄音時長 (30秒)");
          }, MAX_RECORDING_TIME);

          startRecordBtn.disabled = true;
          stopRecordBtn.disabled = false;
          updateStatus(
            '<span class="material-symbols-outlined filled">mic</span> 錄音中... (靜音2秒自動停止)',
            true
          );

          console.log("錄音開始...");
        } catch (error) {
          console.error("錄音失敗：", error);
          updateStatus("錄音失敗，請檢查麥克風權限", false);
        }
      });

      // Stop recording
      stopRecordBtn.addEventListener("click", () => {
        // 清除最大時長計時器
        if (maxTimeTimer) {
          clearTimeout(maxTimeTimer);
          maxTimeTimer = null;
        }

        // 重置靜音檢測
        silenceStart = null;

        mediaRecorder.stop();
        cancelAnimationFrame(animationId);

        startRecordBtn.disabled = false;
        stopRecordBtn.disabled = true;
        updateStatus("⏳ 處理中...", true);

        mediaRecorder.onstop = async () => {
          const audioBlob = new Blob(audioChunks, { type: "audio/wav" });
          const formData = new FormData();
          formData.append("file", audioBlob, "recording.wav");

          // <span class="material-symbols-outlined filled">check_circle</span> 添加對話上下文
          formData.append(
            "conversation_context",
            JSON.stringify(conversationHistory)
          );
          formData.append("conversation_round", conversationRound);

          console.log(
            `<span class="material-symbols-outlined filled">upload</span> 發送請求 - 輪次: ${conversationRound}, 歷史: ${conversationHistory.length} 條`
          );

          try {
            const response = await fetch("/process_audio", {
              method: "POST",
              body: formData,
            });

            const result = await response.json();

            if (response.ok) {
              // 1. 先顯示使用者訊息（語音轉文字結果）
              if (result.transcript) {
                addUserMessage(result.transcript);

                // <span class="material-symbols-outlined filled">check_circle</span> 添加到對話歷史
                conversationHistory.push({
                  role: "user",
                  content: result.transcript,
                });

                // 限制歷史長度（保留最近 10 條）
                if (conversationHistory.length > 10) {
                  conversationHistory = conversationHistory.slice(-10);
                }

                // 記錄用戶對話
                if (scoreManager) {
                  scoreManager.recordConversation(
                    "user",
                    result.transcript,
                    result.sentiment,
                    0.8
                  );
                }
              } else {
                addUserMessage("（無法識別語音內容）");
              }

              // 2. 顯示 AI 正在思考
              addTypingIndicator();

              // 3. 延遲後顯示 AI 回應（模擬思考時間）
              setTimeout(async () => {
                removeTypingIndicator();

                // 顯示 AI 回應和情緒（使用打字機效果）
                const emotionInfo = result.sentiment
                  ? getEmotionInfo(result.sentiment)
                  : null;

                const responseText =
                  result.response || "抱歉，我現在無法回應。";

                // 等待打字機效果完成
                await addAIMessage(responseText, emotionInfo, true);

                // <span class="material-symbols-outlined filled">check_circle</span> 添加到對話歷史
                conversationHistory.push({
                  role: "assistant",
                  content: responseText,
                });

                // 限制歷史長度
                if (conversationHistory.length > 10) {
                  conversationHistory = conversationHistory.slice(-10);
                }

                // <span class="material-symbols-outlined filled">check_circle</span> 更新對話輪次
                conversationRound =
                  result.conversation_round || conversationRound + 1;

                console.log(
                  `<span class="material-symbols-outlined filled">refresh</span> 對話更新 - 輪次: ${conversationRound}, 歷史: ${conversationHistory.length} 條`
                );

                // 記錄 AI 對話
                if (scoreManager) {
                  scoreManager.recordConversation(
                    "ai",
                    responseText,
                    result.sentiment,
                    0.9
                  );
                }

                updateStatus(
                  '<span class="material-symbols-outlined filled">check_circle</span> 文字顯示完成',
                  false
                );

                // 4. 打字完成後處理語音
                console.log("API 回應:", result);
                console.log("TTS 狀態:", result.tts_status);
                console.log("任務 ID:", result.task_id);

                // 如果 TTS 正在生成，顯示提示並開始輪詢
                if (result.tts_status === "generating" && result.task_id) {
                  updateStatus(
                    '<span class="material-symbols-outlined filled">music_note</span> 正在生成語音...',
                    true
                  );

                  // 輪詢檢查 TTS 狀態
                  const checkTTSStatus = async () => {
                    try {
                      const ttsResponse = await fetch(
                        `/api/check-tts/${result.task_id}`
                      );
                      const ttsResult = await ttsResponse.json();

                      if (ttsResult.status === "ready" && ttsResult.audio_url) {
                        console.log(
                          '<span class="material-symbols-outlined filled">check_circle</span> TTS 生成完成:',
                          ttsResult.audio_url
                        );
                        // TTS 準備好了，播放語音
                        playAudio(ttsResult.audio_url);
                      } else {
                        // 還在生成，1 秒後再檢查
                        setTimeout(checkTTSStatus, 1000);
                      }
                    } catch (error) {
                      console.error("檢查 TTS 狀態失敗:", error);
                      updateStatus(
                        '<span class="material-symbols-outlined filled">warning</span> 語音生成失敗',
                        false
                      );
                    }
                  };

                  // 延遲 3 秒後開始檢查（給用戶閱讀時間）
                  setTimeout(checkTTSStatus, 3000);
                } else if (result.audio_url) {
                  // TTS 已經準備好（舊邏輯兼容）
                  setTimeout(() => {
                    playAudio(result.audio_url);
                  }, 3000);
                } else {
                  console.warn("API 未返回 audio_url 或 task_id");
                  updateStatus(
                    '<span class="material-symbols-outlined filled">warning</span> 未生成語音',
                    false
                  );
                }
              }, 1000); // 1 秒延遲，讓使用者看到思考動畫
            } else {
              throw new Error(result.error || "處理音頻時發生錯誤");
            }
          } catch (error) {
            console.error("音頻處理失敗：", error);
            removeTypingIndicator();
            addAIMessage("抱歉，處理您的訊息時發生錯誤，請稍後再試。");
            updateStatus(
              '<span class="material-symbols-outlined filled">cancel</span> 處理失敗',
              false
            );
          }

          audioChunks = [];
        };
      });

                      document.removeEventListener("click", playOnClick);
                    })
                    .catch((err) => console.error("仍然無法播放:", err));
                };
                document.addEventListener("click", playOnClick, { once: true });
              } else {
                updateStatus(
                  '<span class="material-symbols-outlined filled">warning</span> 語音播放失敗',
                  false
                );
              }
            });
        } catch (error) {
          console.error("創建音頻播放器失敗:", error);
          updateStatus(
            '<span class="material-symbols-outlined filled">warning</span> 語音系統錯誤',
            false
          );
        }
      }

      // Resize canvas on window resize
      window.addEventListener("resize", () => {
        waveformCanvas.width = waveformCanvas.parentElement.offsetWidth;
        waveformCanvas.height = waveformCanvas.parentElement.offsetHeight;
      });

      // 檢查登入狀態
      function checkLoginStatus() {
        const currentUser = localStorage.getItem("currentUser");
        if (!currentUser) {
          window.location.href =
            "/login?return=" + encodeURIComponent(window.location.pathname);
          return false;
        }

        const userData = JSON.parse(currentUser);
        console.log(
          '<span class="material-symbols-outlined filled">check_circle</span> 用戶已登入:',
          userData.full_name || userData.username
        );

        // 顯示用戶資訊
        const userInfo = document.createElement("div");
        userInfo.style.cssText =
          "position: fixed; top: 20px; right: 20px; background: white; padding: 12px 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); z-index: 1000; font-size: 14px;";
        userInfo.innerHTML = `
          <span style="color: #666;"><span class="material-symbols-outlined filled">person</span> ${
            userData.full_name || userData.username
          }</span>
          <button onclick="logout()" style="margin-left: 12px; padding: 4px 12px; border: 1px solid #e9ecef; border-radius: 4px; background: white; cursor: pointer; font-size: 12px;">登出</button>
        `;
        document.body.appendChild(userInfo);

        return true;
      }

      // 登出功能
      function logout() {
        if (confirm("確定要登出嗎？")) {
          localStorage.removeItem("currentUser");
          window.location.href = "/login";
        }
      }

      // 顯示評分 Modal
      function showScoreModalForInput() {
        const modal = document.getElementById("scoreModal");
        if (!modal) return;

        // 填充統計資訊
        const conversationCount = conversationHistory.length;
        const totalWords = conversationHistory.reduce(
          (sum, c) => sum + (c.content?.length || 0),
          0
        );
        const duration = Math.floor(
          (new Date() - scoreManager.sessionStartTime) / 1000
        );

        document.getElementById("statConversations").textContent =
          conversationCount;
        document.getElementById("statWords").textContent = totalWords;
        document.getElementById("statDuration").textContent =
          formatDuration(duration);

        // 重置滑桿
        document.getElementById("emotionScoreSlider").value = 50;
        document.getElementById("voiceScoreSlider").value = 50;
        document.getElementById("contentScoreSlider").value = 50;
        document.getElementById("emotionScoreDisplay").textContent = 50;
        document.getElementById("voiceScoreDisplay").textContent = 50;
        document.getElementById("contentScoreDisplay").textContent = 50;
        document.getElementById("feedbackText").value = "";

        updateOverallScore();

        modal.style.display = "flex";
      }

      // 格式化持續時間
      function formatDuration(seconds) {
        const minutes = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${minutes}分${secs}秒`;
      }

      // Initialize
      window.addEventListener("DOMContentLoaded", () => {
        // 檢查登入狀態
        if (!checkLoginStatus()) {
          return;
        }

        // 初始化評分管理器
        scoreManager = new ScoreManager();
        window.scoreManager = scoreManager;

        // 綁定「結束對話」按鈕
        const endSessionBtn = document.getElementById("endSession");
        if (endSessionBtn) {
          endSessionBtn.addEventListener("click", () => {
            if (conversationHistory.length === 0) {
              alert("目前沒有對話記錄");
              return;
            }

            if (confirm("確定要結束對話嗎？將開啟評分表單。")) {
              showScoreModalForInput();
            }
          });
        }

        showWeatherGreeting();
      });
    </script>

    <!-- 評分報告彈窗 V2 -->
    {% include 'score_report_modal_v2.html' %}

    <!-- 評分系統 JS -->
    <script src="{{ url_for('static', filename='js/score_manager.js') }}"></script>
  </body>
</html>
