<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>即時語音互動 - 閩南語版（Roy）</title>

    <!-- Material Icons -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />

    <!-- Enhanced CSS -->
    <link rel="stylesheet" href="/static/css/voice_interaction_enhanced.css" />

    <style>
      /* 閩南語版本特殊樣式（商務橙色主題） */
      .header {
        background: #d35400;
        border-bottom-color: #e67e22;
      }

      .message.user .message-bubble {
        background: #e67e22;
      }

      .btn-start {
        background: #e67e22;
      }

      .btn-start:hover:not(:disabled) {
        background: #d35400;
        box-shadow: 0 3px 6px rgba(230, 126, 34, 0.3);
      }

      .slider::-webkit-slider-thumb {
        background: #e67e22;
      }

      .slider::-webkit-slider-thumb:hover {
        background: #d35400;
      }

      .quick-btn:hover {
        background: #e67e22;
        border-color: #e67e22;
      }

      .history-item:hover {
        border-color: #e67e22;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <div class="header">
        <div style="display: flex; align-items: center; gap: 15px">
          <a
            href="/voice_interaction_realtime/"
            class="back-btn"
            title="返回選單"
          >
            <span class="material-icons">arrow_back</span>
          </a>
          <h1>
            <span class="material-icons">record_voice_over</span>
            即時語音互動 - 閩南語版
          </h1>
        </div>
        <div class="status-bar">
          <div class="status-dot" id="statusDot"></div>
          <span id="statusText">未連接</span>
        </div>
      </div>

      <!-- Waveform Visualization -->
      <div class="waveform-container">
        <canvas id="waveformCanvas" class="waveform-canvas"></canvas>
      </div>

      <!-- Conversation Area with History Sidebar -->
      <div class="conversation-wrapper">
        <div class="conversation-area" id="conversationArea">
          <div class="empty-state">
            <span class="material-icons">waving_hand</span>
            <h3>歡迎使用即時語音互動模組</h3>
            <p>點擊「開始對話」按鈕開始與 AI 助理對話</p>
          </div>
        </div>

        <!-- History Sidebar -->
        <div class="history-sidebar">
          <div class="history-header">
            <h3>
              <span class="material-icons" style="font-size: 18px"
                >history</span
              >
              對話歷史
            </h3>
            <button
              id="clearHistoryBtn"
              style="
                background: none;
                border: none;
                cursor: pointer;
                color: #999;
              "
              title="清除歷史"
            >
              <span class="material-icons" style="font-size: 18px">delete</span>
            </button>
          </div>
          <div class="history-list" id="historyList">
            <div class="history-empty">尚無對話記錄</div>
          </div>
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="quick-actions">
        <div class="quick-actions-title">
          <span class="material-icons" style="font-size: 16px">bolt</span>
          快速回應
        </div>
        <div class="quick-buttons" id="quickButtons">
          <button class="quick-btn" data-text="今仔日天氣按怎？">
            <span class="material-icons" style="font-size: 16px">wb_sunny</span>
            今仔日天氣
          </button>
          <button class="quick-btn" data-text="這馬幾點？">
            <span class="material-icons" style="font-size: 16px">schedule</span>
            這馬時間
          </button>
          <button class="quick-btn" data-text="講一个笑詼">
            <span class="material-icons" style="font-size: 16px"
              >sentiment_satisfied</span
            >
            講笑詼
          </button>
          <button class="quick-btn" data-text="放音樂">
            <span class="material-icons" style="font-size: 16px"
              >music_note</span
            >
            放音樂
          </button>
          <button class="quick-btn" data-text="提醒我食藥">
            <span class="material-icons" style="font-size: 16px"
              >medication</span
            >
            食藥提醒
          </button>
          <button class="quick-btn" data-text="查詢行程">
            <span class="material-icons" style="font-size: 16px">event</span>
            查詢行程
          </button>
        </div>
      </div>

      <!-- Main Controls -->
      <div class="main-controls">
        <button class="control-btn btn-start" id="startBtn">
          <span class="material-icons">mic</span>
          <span>開始對話</span>
        </button>
        <button class="control-btn btn-stop" id="stopBtn" disabled>
          <span class="material-icons">stop</span>
          <span>結束對話</span>
        </button>
      </div>

      <div class="recording-indicator" id="recordingIndicator">
        <div class="recording-dot"></div>
        <span>正在錄音...</span>
      </div>

      <!-- Settings Panel -->
      <div class="settings-panel">
        <div class="settings-row">
          <div class="setting-item">
            <div class="setting-label">
              <span class="material-icons" style="font-size: 18px"
                >volume_up</span
              >
              音量控制
            </div>
            <div class="setting-control">
              <input
                type="range"
                id="volumeSlider"
                class="slider"
                min="0"
                max="100"
                value="80"
              />
              <span class="slider-value" id="volumeValue">80%</span>
            </div>
          </div>

          <div class="setting-item">
            <div class="setting-label">
              <span class="material-icons" style="font-size: 18px">speed</span>
              語速控制
            </div>
            <div class="setting-control">
              <input
                type="range"
                id="speedSlider"
                class="slider"
                min="50"
                max="200"
                value="90"
              />
              <span class="slider-value" id="speedValue">0.9x</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="/static/js/voice_waveform.js"></script>
    <script>
      const VOICE = "Roy";
      const API_BASE = "/voice_interaction_realtime";
    </script>
    <script src="/static/js/voice_interaction_realtime.js"></script>
  </body>
</html>
