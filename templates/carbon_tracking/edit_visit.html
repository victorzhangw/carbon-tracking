<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>編輯訪視記錄 - 碳排放追蹤系統</title>

    <!-- PWA Meta Tags -->
    <meta name="description" content="社工訪視碳排放追蹤與管理系統" />
    <meta name="theme-color" content="#689F38" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />

    <!-- Material Icons -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Microsoft JhengHei", Arial, sans-serif;
        background: linear-gradient(135deg, #f1f8e9 0%, #e8f5e9 100%);
        min-height: 100vh;
      }

      .navbar {
        background: linear-gradient(135deg, #689f38 0%, #7cb342 100%);
        color: white;
        padding: 10px 20px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .navbar h1 {
        font-size: 1.2em;
      }
      .navbar a {
        color: white;
        text-decoration: none;
        margin-left: 15px;
        opacity: 0.9;
        font-size: 0.9em;
      }
      .navbar a:hover {
        opacity: 1;
      }

      .container {
        max-width: 900px;
        margin: 15px auto;
        padding: 0 15px;
      }

      .form-card {
        background: white;
        border-radius: 8px;
        padding: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        margin-bottom: 15px;
      }

      .form-card h2 {
        margin-bottom: 15px;
        color: #558b2f;
        font-size: 1.1em;
        border-bottom: 2px solid #9ccc65;
        padding-bottom: 8px;
      }

      .form-group {
        margin-bottom: 12px;
      }

      .form-group label {
        display: block;
        margin-bottom: 4px;
        color: #555;
        font-weight: 500;
        font-size: 0.9em;
      }

      .form-group input,
      .form-group select,
      .form-group textarea {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #dcedc8;
        border-radius: 4px;
        font-size: 0.9em;
        font-family: inherit;
      }

      .form-group input:focus,
      .form-group select:focus,
      .form-group textarea:focus {
        outline: none;
        border-color: #8bc34a;
        box-shadow: 0 0 0 2px rgba(139, 195, 74, 0.1);
      }

      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .btn {
        padding: 8px 20px;
        border: none;
        border-radius: 4px;
        font-size: 0.9em;
        cursor: pointer;
        transition: all 0.3s;
      }

      .btn-primary {
        background: #8bc34a;
        color: white;
      }

      .btn-primary:hover {
        background: #7cb342;
      }

      .btn-secondary {
        background: #bdbdbd;
        color: white;
        margin-left: 10px;
      }

      .btn-secondary:hover {
        background: #9e9e9e;
      }

      .alert {
        padding: 12px;
        border-radius: 4px;
        margin-bottom: 15px;
        display: none;
        font-size: 0.9em;
      }

      .alert-success {
        background: #dcedc8;
        color: #33691e;
        border: 1px solid #c5e1a5;
      }

      .alert-error {
        background: #ffcdd2;
        color: #b71c1c;
        border: 1px solid #ef9a9a;
      }

      .loading {
        text-align: center;
        padding: 30px;
        color: #666;
      }

      @media (max-width: 768px) {
        .form-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="navbar">
      <h1>
        <span class="material-icons" style="vertical-align: middle">edit</span>
        編輯訪視記錄
      </h1>
      <div>
        <a href="/carbon/">← 首頁</a>
        <a href="/carbon/visit-records">訪視記錄</a>
      </div>
    </div>

    <div class="container">
      <div id="alertBox" class="alert"></div>
      <div id="loadingBox" class="loading">載入中...</div>

      <div class="form-card" id="formCard" style="display: none">
        <h2>訪視資訊</h2>
        <form id="visitForm">
          <input type="hidden" id="recordId" />

          <div class="form-row">
            <div class="form-group">
              <label>訪視日期 *</label>
              <input type="date" id="visitDate" required />
            </div>
            <div class="form-group">
              <label>訪視類型 *</label>
              <select id="visitType" required>
                <option value="">請選擇</option>
                <option value="定期關懷">定期關懷</option>
                <option value="健康檢查">健康檢查</option>
                <option value="緊急訪視">緊急訪視</option>
                <option value="例行訪視">例行訪視</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>社工編號 *</label>
              <input type="text" id="workerId" required />
            </div>
            <div class="form-group">
              <label>社工姓名 *</label>
              <input type="text" id="workerName" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>長者編號 *</label>
              <input type="text" id="elderId" required />
            </div>
            <div class="form-group">
              <label>長者姓名</label>
              <input type="text" id="elderName" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>交通工具 *</label>
              <select id="transportType" required>
                <option value="">請選擇</option>
                <option value="機車">機車</option>
                <option value="汽車">汽車</option>
                <option value="大眾運輸">大眾運輸</option>
              </select>
            </div>
            <div class="form-group">
              <label>行駛里程（公里）*</label>
              <input type="number" id="distance" step="0.1" min="0" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>行駛時間（分鐘）</label>
              <input type="number" id="travelTime" min="0" />
            </div>
            <div class="form-group">
              <label>預估碳排放</label>
              <input
                type="text"
                id="carbonEmission"
                readonly
                style="background: #f9fbe7"
              />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>出發地點</label>
              <input type="text" id="startLocation" />
            </div>
            <div class="form-group">
              <label>目的地點</label>
              <input type="text" id="endLocation" />
            </div>
          </div>

          <div class="form-group">
            <label>備註</label>
            <textarea id="notes" rows="2"></textarea>
          </div>

          <div style="margin-top: 20px">
            <button type="submit" class="btn btn-primary">
              <span
                class="material-icons"
                style="vertical-align: middle; font-size: 1em"
                >save</span
              >
              儲存變更
            </button>
            <button
              type="button"
              class="btn btn-secondary"
              onclick="window.history.back()"
            >
              <span
                class="material-icons"
                style="vertical-align: middle; font-size: 1em"
                >cancel</span
              >
              取消
            </button>
          </div>
        </form>
      </div>
    </div>

    <script>
      const emissionCoefficients = {
        機車: 0.0695,
        汽車: 0.185,
        大眾運輸: 0.0295,
      };

      // 從 URL 取得記錄 ID
      const urlParams = new URLSearchParams(window.location.search);
      const recordId = urlParams.get("id");

      if (!recordId) {
        showAlert("error", "✗ 缺少記錄 ID");
        setTimeout(
          () => (window.location.href = "/carbon/visit-records"),
          2000
        );
      } else {
        loadRecord(recordId);
      }

      async function loadRecord(id) {
        try {
          const response = await fetch(`/carbon/api/visit-records/${id}`);
          const result = await response.json();

          if (result.success) {
            const data = result.data;

            // 填入表單
            document.getElementById("recordId").value = data.id;
            document.getElementById("visitDate").value = data.visit_date;
            document.getElementById("visitType").value = data.visit_type;
            document.getElementById("workerId").value = data.social_worker_id;
            document.getElementById("workerName").value =
              data.social_worker_name;
            document.getElementById("elderId").value = data.elder_id;
            document.getElementById("elderName").value = data.elder_name || "";
            document.getElementById("transportType").value =
              data.transport_type;
            document.getElementById("distance").value = data.distance;
            document.getElementById("travelTime").value =
              data.travel_time || "";
            document.getElementById("startLocation").value =
              data.start_location || "";
            document.getElementById("endLocation").value =
              data.end_location || "";
            document.getElementById("notes").value = data.notes || "";

            // 計算碳排放
            calculateEmission();

            // 顯示表單
            document.getElementById("loadingBox").style.display = "none";
            document.getElementById("formCard").style.display = "block";
          } else {
            showAlert("error", "✗ 載入失敗：" + result.error);
            setTimeout(
              () => (window.location.href = "/carbon/visit-records"),
              2000
            );
          }
        } catch (error) {
          showAlert("error", "✗ 發生錯誤：" + error.message);
          setTimeout(
            () => (window.location.href = "/carbon/visit-records"),
            2000
          );
        }
      }

      function calculateEmission() {
        const transportType = document
          .getElementById("transportType")
          .value.replace(/[🏍️🚗🚌]\\s*/, "");
        const distance =
          parseFloat(document.getElementById("distance").value) || 0;

        if (transportType && distance > 0) {
          const coefficient = emissionCoefficients[transportType];
          const emission = (distance * coefficient).toFixed(3);
          document.getElementById(
            "carbonEmission"
          ).value = `${emission} kg CO2e`;
        } else {
          document.getElementById("carbonEmission").value = "";
        }
      }

      document
        .getElementById("transportType")
        .addEventListener("change", calculateEmission);
      document
        .getElementById("distance")
        .addEventListener("input", calculateEmission);

      // 工號輸入時自動查詢姓名
      document
        .getElementById("workerId")
        .addEventListener("blur", async function () {
          const workerId = this.value.trim();
          if (!workerId) return;

          try {
            const response = await fetch(
              `/carbon/api/social-worker/${workerId}`
            );
            const result = await response.json();

            if (result.success) {
              document.getElementById("workerName").value = result.name;
              // 顯示提示
              const workerNameInput = document.getElementById("workerName");
              workerNameInput.style.background = "#E8F5E9";
              setTimeout(() => {
                workerNameInput.style.background = "";
              }, 1000);
            }
          } catch (error) {
            console.error("查詢社工姓名失敗:", error);
          }
        });

      document
        .getElementById("visitForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const id = document.getElementById("recordId").value;
          const transportType = document
            .getElementById("transportType")
            .value.replace(/[🏍️🚗🚌]\\s*/, "");

          const data = {
            visit_date: document.getElementById("visitDate").value,
            social_worker_id: document.getElementById("workerId").value,
            social_worker_name: document.getElementById("workerName").value,
            elder_id: document.getElementById("elderId").value,
            elder_name: document.getElementById("elderName").value,
            visit_type: document.getElementById("visitType").value,
            transport_type: transportType,
            distance: parseFloat(document.getElementById("distance").value),
            travel_time:
              parseInt(document.getElementById("travelTime").value) || null,
            start_location: document.getElementById("startLocation").value,
            end_location: document.getElementById("endLocation").value,
            notes: document.getElementById("notes").value,
          };

          try {
            const response = await fetch(`/carbon/api/visit-records/${id}`, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(data),
            });

            const result = await response.json();

            if (result.success) {
              showAlert("success", "✓ 記錄已成功更新！");
              setTimeout(() => {
                window.location.href = "/carbon/visit-records";
              }, 1500);
            } else {
              showAlert("error", "✗ 更新失敗：" + result.error);
            }
          } catch (error) {
            showAlert("error", "✗ 發生錯誤：" + error.message);
          }
        });

      function showAlert(type, message) {
        const alertBox = document.getElementById("alertBox");
        alertBox.className = `alert alert-${type}`;
        alertBox.textContent = message;
        alertBox.style.display = "block";

        setTimeout(() => {
          alertBox.style.display = "none";
        }, 5000);
      }
    </script>

    <!-- PWA Service Worker Registration -->
    <script src="/static/pwa-register.js"></script>
  </body>
</html>
