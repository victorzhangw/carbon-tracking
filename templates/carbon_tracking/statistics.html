<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>統計報表 - 碳排放追蹤系統</title>

    <!-- PWA Meta Tags -->
    <meta name="description" content="社工訪視碳排放追蹤與管理系統" />
    <meta name="theme-color" content="#689F38" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />

    <!-- Material Icons -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Microsoft JhengHei", Arial, sans-serif;
        background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
      }

      .navbar {
        background: linear-gradient(135deg, #2e7d32 0%, #388e3c 100%);
        color: white;
        padding: 10px 20px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .navbar h1 {
        font-size: 1.2em;
      }
      .navbar a {
        color: white;
        text-decoration: none;
        margin-left: 15px;
        opacity: 0.9;
        font-size: 0.9em;
      }
      .navbar a:hover {
        opacity: 1;
      }

      .container {
        max-width: 1600px;
        margin: 15px auto;
        padding: 0 15px;
      }

      .report-card {
        background: white;
        border-radius: 8px;
        padding: 15px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        margin-bottom: 12px;
      }

      .report-card h2 {
        margin-bottom: 12px;
        color: #2e7d32;
        font-size: 1.1em;
        border-bottom: 2px solid #4caf50;
        padding-bottom: 8px;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 12px;
        margin-bottom: 15px;
      }

      .stat-box {
        background: #e8f5e9;
        padding: 12px;
        border-radius: 6px;
        text-align: center;
      }

      .stat-box .value {
        font-size: 1.4em;
        font-weight: bold;
        color: #2e7d32;
        margin-bottom: 3px;
      }

      .stat-box .label {
        color: #666;
        font-size: 0.8em;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 12px;
        font-size: 0.85em;
      }
      th {
        background: #e8f5e9;
        padding: 8px;
        text-align: left;
        font-weight: 600;
        color: #2e7d32;
        border-bottom: 2px solid #c8e6c9;
      }
      td {
        padding: 8px;
        border-bottom: 1px solid #e8f5e9;
      }
      .highlight {
        background: #fff9c4;
        font-weight: bold;
      }

      @media (max-width: 1200px) {
        .stats-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <div class="navbar">
      <h1>
        <span class="material-icons" style="vertical-align: middle"
          >analytics</span
        >
        統計報表
      </h1>
      <div>
        <a href="/carbon/">← 首頁</a>
        <a href="/carbon/dashboard">儀表板</a>
        <button
          onclick="exportAllData()"
          style="
            background: white;
            color: #689f38;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 10px;
          "
        >
          <span
            class="material-icons"
            style="vertical-align: middle; font-size: 1em"
            >table_chart</span
          >
          匯出完整資料
        </button>
      </div>
    </div>

    <div class="container">
      <div class="report-card">
        <h2>
          <span
            class="material-icons"
            style="vertical-align: middle; color: #2e7d32; font-size: 1.2em"
            >assessment</span
          >
          總體統計（2024/06-09）
        </h2>
        <div class="stats-grid">
          <div class="stat-box">
            <div class="value" id="totalVisits">-</div>
            <div class="label">總訪視次數</div>
          </div>
          <div class="stat-box">
            <div class="value" id="totalElders">-</div>
            <div class="label">服務長者</div>
          </div>
          <div class="stat-box">
            <div class="value" id="totalDistance">-</div>
            <div class="label">總里程（公里）</div>
          </div>
          <div class="stat-box">
            <div class="value" id="totalEmission">-</div>
            <div class="label">碳排放（公噸）</div>
          </div>
          <div class="stat-box">
            <div class="value" id="avgDistance">-</div>
            <div class="label">平均里程（公里）</div>
          </div>
        </div>
      </div>

      <div class="report-card">
        <h2>
          <span
            class="material-icons"
            style="vertical-align: middle; color: #2e7d32; font-size: 1.2em"
            >calendar_month</span
          >
          月度統計明細
        </h2>
        <table id="monthlyTable">
          <thead>
            <tr>
              <th>月份</th>
              <th>訪視次數</th>
              <th>總里程（公里）</th>
              <th>碳排放（kg）</th>
              <th>碳排放（公噸）</th>
              <th>AI關懷次數</th>
            </tr>
          </thead>
          <tbody id="monthlyBody">
            <tr>
              <td colspan="6" style="text-align: center">載入中...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="report-card">
        <h2>
          <span
            class="material-icons"
            style="vertical-align: middle; color: #2e7d32; font-size: 1.2em"
            >commute</span
          >
          交通工具統計
        </h2>
        <table id="transportTable">
          <thead>
            <tr>
              <th>交通工具</th>
              <th>使用次數</th>
              <th>使用比例</th>
              <th>總里程（公里）</th>
              <th>碳排放（kg）</th>
            </tr>
          </thead>
          <tbody id="transportBody">
            <tr>
              <td colspan="5" style="text-align: center">載入中...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <script>
      async function loadStatistics() {
        try {
          const summaryResponse = await fetch(
            "/carbon/api/statistics-summary?start_date=2024-06-01&end_date=2024-09-30"
          );
          const summaryResult = await summaryResponse.json();

          if (summaryResult.success) {
            const data = summaryResult.data;
            document.getElementById("totalVisits").textContent =
              data.total_visits.toLocaleString();
            document.getElementById("totalElders").textContent =
              data.unique_elders.toLocaleString();
            document.getElementById("totalDistance").textContent =
              data.total_distance.toLocaleString(undefined, {
                maximumFractionDigits: 0,
              });
            document.getElementById("totalEmission").textContent = (
              data.total_emission / 1000
            ).toFixed(2);
            document.getElementById("avgDistance").textContent =
              data.avg_distance.toFixed(1);
          }

          const periodResponse = await fetch(
            "/carbon/api/period-statistics?start_date=2024-06-01&end_date=2024-09-30"
          );
          const periodResult = await periodResponse.json();

          if (periodResult.success) {
            const tbody = document.getElementById("monthlyBody");
            tbody.innerHTML = "";

            let totalVisits = 0,
              totalDistance = 0,
              totalEmission = 0,
              totalAiCare = 0;

            periodResult.data.forEach((month) => {
              const row = document.createElement("tr");
              row.innerHTML = `
                            <td>${month.year}/${month.month}</td>
                            <td>${month.physical_visits.toLocaleString()}</td>
                            <td>${month.total_distance.toLocaleString(
                              undefined,
                              { maximumFractionDigits: 0 }
                            )}</td>
                            <td>${month.total_carbon_emission.toLocaleString(
                              undefined,
                              { maximumFractionDigits: 2 }
                            )}</td>
                            <td>${(month.total_carbon_emission / 1000).toFixed(
                              2
                            )}</td>
                            <td>${month.ai_care_count.toLocaleString()}</td>
                        `;
              tbody.appendChild(row);

              totalVisits += month.physical_visits;
              totalDistance += month.total_distance;
              totalEmission += month.total_carbon_emission;
              totalAiCare += month.ai_care_count;
            });

            const totalRow = document.createElement("tr");
            totalRow.className = "highlight";
            totalRow.innerHTML = `
                        <td><strong>總計</strong></td>
                        <td><strong>${totalVisits.toLocaleString()}</strong></td>
                        <td><strong>${totalDistance.toLocaleString(undefined, {
                          maximumFractionDigits: 0,
                        })}</strong></td>
                        <td><strong>${totalEmission.toLocaleString(undefined, {
                          maximumFractionDigits: 2,
                        })}</strong></td>
                        <td><strong>${(totalEmission / 1000).toFixed(
                          2
                        )}</strong></td>
                        <td><strong>${totalAiCare.toLocaleString()}</strong></td>
                    `;
            tbody.appendChild(totalRow);
          }

          const transportResponse = await fetch(
            "/carbon/api/transport-distribution?start_date=2024-06-01&end_date=2024-09-30"
          );
          const transportResult = await transportResponse.json();

          if (transportResult.success) {
            const tbody = document.getElementById("transportBody");
            tbody.innerHTML = "";

            const totalCount = transportResult.data.reduce(
              (sum, item) => sum + item.count,
              0
            );

            transportResult.data.forEach((item) => {
              const row = document.createElement("tr");
              const percentage = ((item.count / totalCount) * 100).toFixed(1);
              row.innerHTML = `
                            <td>${item.transport_type}</td>
                            <td>${item.count.toLocaleString()}</td>
                            <td>${percentage}%</td>
                            <td>${item.total_distance.toLocaleString(
                              undefined,
                              { maximumFractionDigits: 0 }
                            )}</td>
                            <td>${item.total_emission.toLocaleString(
                              undefined,
                              { maximumFractionDigits: 2 }
                            )}</td>
                        `;
              tbody.appendChild(row);
            });
          }
        } catch (error) {
          console.error("Error loading statistics:", error);
        }
      }

      loadStatistics();

      function exportAllData() {
        if (confirm("確定要匯出所有訪視記錄嗎？\n這可能需要一些時間...")) {
          window.location.href = "/carbon/api/export/excel";
        }
      }
    </script>

    <!-- PWA Service Worker Registration -->
    <script src="/static/pwa-register.js"></script>
  </body>
</html>
